<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Quiz sobre Hardware e Inteligência Artificial"
    />

    <title>Desafio Tech</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container quiz-container">
      <!-- Cabeçalho -->
      <div class="text-center mb-4 header-bg">
        <h1 class="titulo">Desafio Tech</h1>
        <p>Bem-vindo! Teste seu conhecimento sobre Hardware e IA.</p>
      </div>

      <!-- Formulário do Quiz (Substituindo botões soltos) -->
      <form id="quiz-form">
        <!-- O JS injetará os Cards aqui -->
        <div id="quiz-questions-container">
          <!-- Carregando... -->
        </div>

        <!-- BOTÃO FINALIZAR -->
        <div class="text-center mt-4">
          <button
            type="submit"
            id="btn-finalizar"
            class="btn btn-danger btn-lg"
            style="display: none"
          >
            Finalizar Quiz
          </button>
        </div>
      </form>

      <!-- RESULTADO FINAL -->
      <div id="resultado" class="card text-center p-5 mt-4">
        <h2 class="titulo-resultado">🏆 Resultado</h2>
        <p id="pontuacaoFinal" class="fs-4"></p>
        <button class="btn btn-danger" onclick="location.reload()">
          Refazer Quiz
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
